<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>金沢から日帰りおすすめマップ | Piece Hostel Sanjo</title>
  <meta name="description" content="金沢を拠点に日帰りで行ける、加賀温泉・五箇山・能作・氷見・富山・福井のおすすめ。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <!-- CSS/JS を更新したら ?v= の数字を上げる（スマホに古いファイルが残らないように） -->
  <link rel="stylesheet" href="../assets/map.css?v=6">
</head>
<body data-route="kanazawa-daytrips" data-root="../">
  <header class="site-header">
    <a class="brand" href="../">Piece Hostel Sanjo <span>Maps</span></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <div class="map-wrap">
      <div id="map" role="region" aria-label="ルートの地図"></div>
    </div>

    <section class="panel">
      <div class="route-head">
        <h1 id="route-title">読み込み中…</h1>
        <p id="route-intro" class="intro"></p>
      </div>
      <ol id="spots" class="spots"></ol>
      <footer class="credit">
        <p id="source-note"></p>
        <p id="rights"></p>
      </footer>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../assets/map.js?v=6"></script>
</body>
</html>
