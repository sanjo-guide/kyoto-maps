<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piece Hostel Sanjo Maps</title>
  <meta name="description" content="Piece Hostel Sanjo のスタッフが実際に歩いて選んだ、京都・金沢のおすすめマップ集。">
  <link rel="stylesheet" href="assets/map.css">
  <style>
    .home { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    .home h1 { font-size: 22px; line-height: 1.4; margin: 0 0 6px; }
    .home .lead { color: var(--muted); margin: 0 0 20px; }
    .cards { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .cards a { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); }
    .cards img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
    .cards strong { display: block; line-height: 1.4; }
    .cards span { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Piece Hostel Sanjo <span>Maps</span></a>
  </header>
  <main class="home">
    <h1>京都・金沢おすすめマップ</h1>
    <p class="lead">Kyoto &amp; Kanazawa maps by the staff of Piece Hostel Sanjo</p>
    <ul class="cards">
      <li>
        <a href="eizan-line/">
          <img src="images/eizan-line/thumbs/04-1.jpg" alt="">
          <div>
            <strong>叡山電鉄沿線 Along Eizan Railway Line</strong>
            <span>出町柳・一乗寺・貴船・鞍馬・先斗町 / 28 spots</span>
          </div>
        </a>
      </li>
      <li>
        <a href="kanazawa/">
          <img src="kanazawa/img/higashi-1.jpg" alt="">
          <div>
            <strong>金沢のおすすめと日帰り旅 Kanazawa &amp; day trips</strong>
            <span>市内9か所・海鮮・日帰り6エリア</span>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
